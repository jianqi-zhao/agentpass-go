name: Go SDK CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * 1"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.25.12", "1.26.5"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: false
      - name: Verify module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Vulnerability scan
        if: matrix.go-version == '1.26.5'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Fuzz protocol boundaries
        if: matrix.go-version == '1.26.5'
        run: |
          go test -run=^$ -fuzz=FuzzNormalizeBaseURL -fuzztime=10s .
          go test -run=^$ -fuzz=FuzzValidateRedirectURI -fuzztime=10s .
          go test -run=^$ -fuzz=FuzzDecodeAPIError -fuzztime=10s .
