name: Publish Go SDK

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version tag, for example v0.2.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^v0\.[0-9]+\.[0-9]+$ ]]
          test "${VERSION#v}" = "$(sed -n 's/.*Version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' client.go)"
          ! git rev-parse "$VERSION" >/dev/null 2>&1
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go test -race ./...
          go vet ./...
      - name: Create immutable tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "$VERSION" -m "AgentPass Go SDK $VERSION"
          git push origin "$VERSION"
          gh release create "$VERSION" --verify-tag --generate-notes --title "AgentPass Go SDK $VERSION"
      - name: Verify the public module
        env:
          VERSION: ${{ inputs.version }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if GOPROXY=https://proxy.golang.org go list -m "github.com/jianqi-zhao/agentpass-go@$VERSION"; then
              exit 0
            fi
            sleep 10
          done
          exit 1
